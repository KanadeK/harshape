[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "harshape"
version = "0.1.0"
description = "Project HAR captures into local performance-only pseudonymous skeletons"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KanadeK"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent", "Environment :: Console"]

[project.urls]
Repository = "https://github.com/KanadeK/harshape"
Issues = "https://github.com/KanadeK/harshape/issues"

[project.scripts]
harshape = "harshape.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"examples/**" = ["S603", "S607"]

[tool.coverage.run]
source = ["harshape"]

[tool.coverage.report]
show_missing = true
